[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "geo-shield"
version = "0.1.0"
description = "Anti-GEO soft-ad detection, indirect prompt injection sanitization, AI memory poisoning inspection, and multi-source cross-verification."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/hongrenw111-debug/geo-shield"
Repository = "https://github.com/hongrenw111-debug/geo-shield"

[project.scripts]
geo-shield = "geo_shield.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/geo_shield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
